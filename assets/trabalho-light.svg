    <text x="328" y="86" fill="#C45C26" fill-opacity="0.18" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="72" font-weight="700">02</text>
    <text x="328" y="78" fill="#C45C26" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">02</text>
    <text x="328" y="118" fill="#1A1612" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="26" font-weight="700">Sorteio Pix</text>

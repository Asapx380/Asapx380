    <text x="328" y="168" fill="#1A1612" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Rifa voluntária: reserva</text>
    <text x="328" y="186" fill="#1A1612" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">de números, Pix, painel e</text>
    <text x="328" y="204" fill="#1A1612" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">sincronização ao vivo.</text>
    <text x="328" y="240" fill="#6B5E52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">JavaScript · Firebase</text>
  <rect x="544" y="40" width="40" height="22" rx="3" fill="none" stroke="#C45C26" stroke-width="1.4"/>

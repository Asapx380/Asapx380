    <text x="36" y="170" fill="#1A1612" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">gráfico histórico e cache</text>
    <text x="36" y="188" fill="#1A1612" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">local quando a API falha.</text>
    <text x="36" y="240" fill="#6B5E52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">React 19 · TypeScript · Vite</text>
  <polyline fill="none" stroke="#C45C26" stroke-width="1.6" points="252,58 260,51 268,54 278,44 288,48"/>

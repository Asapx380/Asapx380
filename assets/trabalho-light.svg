    <text x="620" y="86" fill="#C45C26" fill-opacity="0.18" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="72" font-weight="700">03</text>
    <text x="620" y="78" fill="#C45C26" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">03</text>
    <text x="620" y="118" fill="#1A1612" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="26" font-weight="700">Forja AI</text>
    <text x="620" y="152" fill="#1A1612" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Rascunho de landing a</text>
    <text x="620" y="170" fill="#1A1612" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">partir de briefing, com</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="268" viewBox="0 0 880 268" role="img">
  <title>Trabalho selecionado</title>
  <desc>câmbio64, Sorteio Pix IBPM e Forja AI.</desc>
  <defs>
    <style>
      .rise { animation: rise .7s cubic-bezier(.22,1,.36,1) both; }
      .rise2 { animation: rise .7s cubic-bezier(.22,1,.36,1) .08s both; }
      .rise3 { animation: rise .7s cubic-bezier(.22,1,.36,1) .16s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .rise, .rise2, .rise3 { animation: none; } }
    </style>
  </defs>
  <rect width="880" height="268" fill="#F4EFE6"/>
  <rect x="0" y="0" width="7" height="268" fill="#C45C26"/>
  <line x1="316" y1="28" x2="316" y2="240" stroke="#C45C26" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="608" y1="28" x2="608" y2="240" stroke="#C45C26" stroke-opacity="0.28" stroke-width="1"/>
  <g class="rise">
    <rect x="36" y="28" width="14" height="3" fill="#C45C26"/>
    <text x="36" y="86" fill="#C45C26" fill-opacity="0.18" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="72" font-weight="700">01</text>
    <text x="36" y="78" fill="#C45C26" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">01</text>

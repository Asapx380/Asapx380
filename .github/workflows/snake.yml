name: Atualizar animação de contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Gerar animações da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Asapx380
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23C45C26&color_dots=%23EDE6DA,%23E8C4A0,%23D4783A,%23C45C26,%238C3A1A
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23E8A15A&color_dots=%231A1612,%233D2A1F,%238C4A32,%23C45C26,%23E8A15A

      - name: Publicar animações
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

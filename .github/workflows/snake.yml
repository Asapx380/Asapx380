name: Atualizar animação de contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Gerar animações da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Asapx380
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230969DA&color_dots=%23EBEDF0,%239BE9A8,%2340C463,%2330A14E,%23216E39
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2358A6FF&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353

      - name: Publicar animações
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
